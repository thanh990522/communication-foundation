<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework · Tiếng Anh Giao Tiếp Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1D4ED8; --navy:#0B1F5C; --sky:#EAF1FF; --sky-2:#D6E4FF;
  --yellow:#FFC72C; --yellow-soft:#FFF6D6; --ink:#0F172A; --muted:#5B6B8C; --line:#E3E8F4; --bg:#F6F8FD;
  --green:#16A34A; --green-soft:#DCFCE7; --red:#DC2626; --red-soft:#FEE2E2;
  --shadow-s:0 4px 14px rgba(11,31,92,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;padding-bottom:110px}
button,input,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
a{color:var(--blue)}

header{background:#fff;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header::before{content:"";position:absolute;right:-90px;top:-110px;width:260px;height:260px;border-radius:50%;background:var(--yellow)}
header::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(var(--blue),var(--navy))}
header .wrap{position:relative;z-index:1;padding-top:18px;padding-bottom:22px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back{font-weight:800;text-decoration:none;font-size:14px}
.me{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:14px;font-weight:700}
.me button{background:var(--yellow);color:var(--navy);border:none;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer}
.kick{display:inline-block;margin-top:16px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 12px;border-radius:999px}
h1{font-size:clamp(26px,5vw,38px);font-weight:900;color:var(--navy);line-height:1.12;margin:10px 0 6px;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--blue)}
.intro{color:var(--muted);font-size:15.5px;max-width:640px}

.notice{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:600}
.notice.warn{background:var(--yellow-soft);border:1.5px solid var(--yellow);color:#6B4A00}
.notice.info{background:var(--sky);border:1.5px solid var(--sky-2);color:var(--navy)}
.notice.good{background:var(--green-soft);border:1.5px solid #86EFAC;color:#14532D}
.notice b{font-weight:800}
.fb{margin-top:6px;padding:10px 12px;background:#fff;border-radius:10px;border-left:4px solid var(--green);color:var(--ink);font-weight:500;white-space:pre-wrap}

main{padding-top:20px}
.sec{background:#fff;border:2px solid var(--line);border-radius:20px;margin-bottom:18px;box-shadow:var(--shadow-s);overflow:hidden}
.sec-h{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--line);background:linear-gradient(90deg,var(--sky),#fff)}
.sec-h h2{font-size:19px;font-weight:900;color:var(--navy)}
.sec-h small{display:block;color:var(--muted);font-size:13.5px;font-weight:600}
.sec-h .pts{flex:none;font-size:12.5px;font-weight:800;color:var(--blue);background:#fff;border:1.5px solid var(--sky-2);padding:4px 10px;border-radius:999px}
.sec.teacher .sec-h{background:linear-gradient(90deg,var(--yellow-soft),#fff)}
.sec.teacher .sec-h .pts{color:#8A5300;border-color:var(--yellow)}
.items{padding:6px 18px 12px}
.it{padding:14px 0;border-bottom:1.5px dashed var(--line);display:flex;gap:12px}
.it:last-child{border-bottom:none}
.qn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--yellow);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.prompt{font-weight:700;color:var(--navy);font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.play{width:46px;height:46px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #163a9e;flex:none}
.play svg{width:17px;height:17px;fill:#fff;margin-left:2px}
.play.on{background:var(--yellow);box-shadow:0 3px 0 #c99400}.play.on svg{fill:var(--navy)}
.play-hint{font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:62px;height:52px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#F8FAFF;font-size:22px;font-weight:900;color:var(--navy);cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.sel{background:var(--navy);border-color:var(--navy);color:var(--yellow)}
input.txt{height:48px;border:2px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;font-weight:700;color:var(--navy);width:100%;max-width:420px}
input.txt:focus,textarea:focus{outline:none;border-color:var(--blue)}
.gapline{font-size:17px;font-weight:600;color:var(--ink);line-height:2.1}
.gapline input{height:40px;width:150px;border:none;border-bottom:3px solid var(--blue);background:var(--sky);border-radius:8px 8px 0 0;padding:0 10px;font-size:17px;font-weight:800;color:var(--blue);text-align:center}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink);resize:vertical;line-height:1.55}
.wc{font-size:13px;font-weight:700;color:var(--muted)}
.wc.ok{color:var(--green)}

.secaud{display:flex;align-items:center;gap:12px;margin:12px 18px 0;padding:12px 14px;border-radius:14px;background:var(--navy);color:#fff}
.secaud b{display:block;font-size:16px}.secaud small{color:#C9D6FF;font-weight:600;font-size:13px}
.secaud .play{background:var(--yellow);box-shadow:0 3px 0 #c99400}.secaud .play svg{fill:var(--navy)}
.secnote{margin:10px 18px 0;padding:10px 14px;border:2px dashed var(--sky-2);border-radius:12px;font-weight:800;color:var(--navy);font-size:14.5px;background:#FBFCFF}
.play.used{opacity:.45}
.notice.exam{display:flex;align-items:center;gap:8px;cursor:pointer}
.notice.exam input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.gapline input.wide{width:min(320px,70vw);text-align:left}
.key{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px}
.key b{color:var(--navy);font-weight:900;letter-spacing:.3px}
.passage{margin:14px 18px 4px;padding:16px 18px;border-radius:14px;background:#FFFDF5;border:2px solid var(--yellow-soft);font-size:17px;line-height:1.7;color:var(--ink)}
.passage p+p{margin-top:10px}
/* marking */
.it.right .qn{background:var(--green);color:#fff}
.it.wrong .qn{background:var(--red);color:#fff}
.mark{font-size:13.5px;font-weight:800;border-radius:999px;padding:3px 10px;display:inline-block}
.mark.right{background:var(--green-soft);color:#15803D}
.mark.wrong{background:var(--red-soft);color:#B91C1C}
.mark.wait{background:var(--yellow-soft);color:#8A5300}

/* recorder */
.rec{border:2px dashed var(--sky-2);border-radius:16px;padding:14px;background:#FBFCFF;display:flex;flex-direction:column;gap:12px}
.rec-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.recbtn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}
.recbtn.go{background:var(--red);color:#fff;box-shadow:0 3px 0 #991B1B}
.recbtn.stop{background:var(--navy);color:#fff}
.recbtn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:#fff}
.recbtn.stop .dot{background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:22px;color:var(--navy)}
.meter{flex:1;min-width:120px;height:10px;background:var(--sky);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow));transition:width .08s}
.rec audio{width:100%;max-width:460px}
.upl{font-size:13.5px;color:var(--muted);font-weight:600}
.upl label{color:var(--blue);font-weight:800;cursor:pointer;text-decoration:underline}

/* submit bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(11,31,92,.08);z-index:20}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.prog{flex:1;min-width:0}
.prog b{font-size:14px;color:var(--navy)}
.prog .pb{height:10px;border-radius:999px;background:var(--sky);overflow:hidden;margin-top:5px}
.prog .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--yellow));width:0;transition:width .25s}
.send{border:none;border-radius:14px;padding:13px 20px;font-weight:900;font-size:16px;background:var(--blue);color:#fff;box-shadow:0 4px 0 #163a9e;cursor:pointer;white-space:nowrap}
.send:disabled{opacity:.6;cursor:default}

/* result */
#result{display:none}
.res{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow-s);text-align:center}
.score{font-size:58px;font-weight:900;color:var(--navy);line-height:1}
.score small{font-size:24px;color:var(--muted)}
.res h2{font-size:22px;color:var(--navy);margin:8px 0 4px}
.res p{color:var(--muted)}
.res .sub2{font-weight:800;color:var(--muted);margin-top:4px}
.res.pass{border-color:#86EFAC;background:linear-gradient(180deg,#F0FDF4,#fff)}
.res.fail{border-color:#FCA5A5;background:linear-gradient(180deg,#FEF2F2,#fff)}
.res.fail .score{color:var(--red)}.res.pass .score{color:var(--green)}
.res .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #163a9e}
.btn.light{background:var(--sky);color:var(--blue)}

#modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(11,31,92,.55)}
#modal .box{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%}
#modal h3{color:var(--navy);font-size:20px;margin-bottom:8px}
#modal p,#modal ul{color:var(--ink);font-size:15px}
#modal ul{padding-left:20px;margin:6px 0}
#modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;padding:11px 16px;border-radius:12px;z-index:95;max-width:90vw;text-align:center;display:none}
/* section extras */
.sec-h h2 small{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-top:2px}
.opt.long{font-size:16px;height:auto;min-height:48px;padding:8px 14px;text-align:left;font-weight:800}
details.script{margin:12px 18px 0;border:2px solid var(--sky-2);border-radius:14px;background:#FBFCFF}
details.script summary{cursor:pointer;padding:10px 14px;font-weight:900;color:var(--blue)}
details.script .sl{padding:4px 14px;font-size:15.5px;line-height:1.55}
details.script .sl b{color:var(--navy);margin-right:6px}
details.script>div{padding-bottom:10px}
/* translate */
.vi{font-weight:800;color:var(--navy);font-size:17px}
.hint{font-size:13.5px;font-weight:700;color:#8A5300;background:var(--yellow-soft);border-radius:8px;padding:3px 9px;align-self:flex-start}
textarea.tr{min-height:64px;font-size:17px;font-weight:600;color:var(--navy)}
.trfb{display:flex;flex-direction:column;gap:4px;font-size:15px}
.trfb .w{border-radius:5px;padding:0 2px}
.w.ok{color:#15803D;background:var(--green-soft)}
.w.bad{color:#B91C1C;background:var(--red-soft);text-decoration:underline wavy #DC2626}
.mark.half{background:var(--yellow-soft);color:#8A5300}
.it.half .qn{background:var(--yellow);color:var(--navy)}
/* shadow */
.shbox{border:2px solid var(--sky-2);border-radius:16px;padding:14px;background:#FBFCFF;display:flex;flex-direction:column;gap:12px}
.shtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shtools .lbl{font-weight:800;color:var(--navy)}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13.5px;color:var(--navy);cursor:pointer}
.pill.on{background:var(--navy);color:var(--yellow);border-color:var(--navy)}
.shtext{font-size:19px;line-height:2;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.shs .sp{display:inline-flex;vertical-align:middle;width:26px;height:26px;border-radius:50%;border:none;background:var(--sky);cursor:pointer;margin:0 4px 0 2px;align-items:center;justify-content:center}
.shs .sp svg{width:11px;height:11px;fill:var(--blue);margin-left:2px}
.shs .sp.on{background:var(--yellow)}
.sw{border-radius:6px;padding:1px 2px;transition:background .2s}
.sw.ok{color:#15803D;background:var(--green-soft);font-weight:700}
.sw.bad{color:#B91C1C;background:var(--red-soft);font-weight:700;text-decoration:underline wavy #DC2626}
.shtext.self .sw{cursor:pointer}
.shres{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sc10{font-size:34px;font-weight:900;line-height:1;color:var(--navy)}
.sc10 small{font-size:16px;color:var(--muted)}
.sc10.hi{color:var(--green)}.sc10.mid{color:#B45309}.sc10.lo{color:var(--red)}
.shmeta{font-size:13.5px;font-weight:700;color:var(--muted)}
.heard{font-size:14px;color:var(--muted);font-style:italic}
.legend{font-size:13px;font-weight:700;color:var(--muted)}
.secbreak{margin:14px auto 0;max-width:520px;text-align:left;display:flex;flex-direction:column;gap:6px}
.secbreak div{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14.5px}
.secbreak b{color:var(--navy);white-space:nowrap}
/* per-part grading */
.part{margin-bottom:26px}
.partbar{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-s);margin-top:-6px}
.partbar .ptxt{flex:1;min-width:180px;font-weight:800;color:var(--navy)}
.partbar .ptxt small{display:block;font-weight:600;color:var(--muted);font-size:13.5px}
.partbar.pass{border-color:#86EFAC;background:linear-gradient(90deg,#F0FDF4,#fff)}
.partbar.fail{border-color:#FCA5A5;background:linear-gradient(90deg,#FEF2F2,#fff)}
.pbig{font-size:30px;font-weight:900;line-height:1}
.partbar.pass .pbig{color:var(--green)}.partbar.fail .pbig{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip5{border:none;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12.5px;cursor:pointer;background:var(--sky);color:var(--navy)}
.chip5.pass{background:var(--green-soft);color:#15803D}.chip5.fail{background:var(--red-soft);color:#B91C1C}
.secbreak div.fail b{color:var(--red)}.secbreak div.pass b{color:var(--green)}
.secbreak button{border:none;background:var(--blue);color:#fff;border-radius:8px;padding:3px 9px;font-weight:800;font-size:12.5px;cursor:pointer;margin-left:8px}
@media (max-width:560px){
  .shtext{font-size:17px;padding:10px 12px}
  .it{gap:10px}.qn{width:30px;height:30px}
  .send{padding:12px 14px;font-size:15px}
  .opt{min-width:56px;height:50px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="topline"><a class="back" href="../">← Tất cả bài học</a><span id="gtMe"></span></div>
  <span class="kick" id="kick">Homework</span>
  <h1 id="title">Homework</h1>
  <p class="intro" id="intro"></p>
  <div id="notices"></div>
</div></header>

<main class="wrap">
  <div id="result"></div>
  <form id="hw" novalidate><div class="loading">Đang tải bài tập…</div></form>
</main>

<div class="bar" id="bar" hidden><div class="wrap">
  <div class="prog"><b id="progTxt">0 / 0 câu đã làm</b><div class="pb"><i id="progBar"></i></div></div>
  <button class="send" id="send" type="button">Nộp bài</button>
</div></div>

<div id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div class="acts" id="mActs"></div></div></div>
<div class="toast" id="toast"></div>

<script src="../assets/config.js"></script>
<script>document.write('<script src="../assets/sessions.js?t='+Date.now()+'"><\/script>')</script>
<script src="../assets/student.js"></script>
<script>
(function(){
const ROOT='../';
const params=new URLSearchParams(location.search);
const SESSION=(params.get('s')||'S01').toUpperCase().replace(/[^S0-9]/g,'');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const PLAY='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const AUTO=['mcq','listen_mcq','listen_type','gap','translate','shadow'];
const PASS=80;   // % needed to pass; below this the homework must be redone
let HW=null, ITEMS=[], answers={}, voice={}, student=null;
let PARTS=[], PART_OF={}, graded={};      // each part is graded on its own; graded[key]={score,max,pct,details}
const isLocked=id=>!!graded[PART_OF[id]];
const stateKey=()=>'gt_hw5_state_'+SESSION;
function saveState(){ try{ localStorage.setItem(stateKey(),JSON.stringify({graded:Object.keys(graded)})); }catch(e){} }
function loadState(){ try{ return (JSON.parse(localStorage.getItem(stateKey())||'{}')||{}).graded||[]; }catch(e){ return []; } }
function buildParts(){
  PARTS=[]; PART_OF={}; const by={};
  HW.sections.forEach((sec,i)=>{
    const m=String(sec.title).match(/^Part\s*(\d+)/i), key=m?'P'+m[1]:'X'+i;
    if(!by[key]){ by[key]={key,num:m?+m[1]:PARTS.length+1,name:String(sec.title).replace(/\s+—\s+.*$/,''),secs:[],items:[]}; PARTS.push(by[key]); }
    by[key].secs.push(sec); sec.items.forEach(it=>{ by[key].items.push(it); PART_OF[it.id]=key; });
  });
}
const partLabel=p=>'Part '+p.num;

/* ---------------- utils */
function toast(m,ms){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',ms||3500); }
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/[\s\-–—]+/g,''); }
const abs=u=>/^(https?:|data:|blob:)/.test(u)?u:ROOT+u;
const words=s=>(String(s).trim().match(/\S+/g)||[]).length;
const draftKey=()=>'gt_hw5_draft_'+SESSION;
function saveDraft(){ try{ localStorage.setItem(draftKey(),JSON.stringify(answers)); }catch(e){} }
function loadDraft(){ try{ answers=JSON.parse(localStorage.getItem(draftKey())||'{}')||{}; }catch(e){ answers={}; } }
function modal(title,html,buttons){
  return new Promise(res=>{
    $('#mTitle').textContent=title; $('#mBody').innerHTML=html;
    $('#mActs').innerHTML=buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||'light'}" data-i="${i}">${b.label}</button>`).join('');
    $('#modal').style.display='flex';
    $('#mActs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#modal').style.display='none'; res(buttons[+b.dataset.i].value); });
  });
}

/* ---------------- audio player (one at a time) */
let player=null, playerBtn=null;
const played={};
function stopAudio(){ if(player){ player.pause(); player=null; } if(playerBtn){ playerBtn.classList.remove('on'); playerBtn.innerHTML=PLAY; playerBtn=null; } }
function playAudio(btn,url){
  if(playerBtn===btn){ stopAudio(); return; }
  stopAudio();
  played[url]=(played[url]||0)+1;
  const a=new Audio(abs(url)); a.playbackRate=audRate; player=a; playerBtn=btn; btn.classList.add('on'); btn.innerHTML=PAUSE;
  a.onended=stopAudio; a.onerror=()=>{ stopAudio(); toast('Không phát được audio. Kiểm tra Internet rồi thử lại.'); };
  a.play().catch(()=>{ stopAudio(); toast('Trình duyệt chặn âm thanh — bấm ▶ lại.'); });
}

/* ---------------- render */
function teacherSection(sec){ return sec.items.every(it=>!AUTO.includes(it.type)); }
function secHtml(sec,nRef){
  const pts=sec.items.reduce((a,it)=>a+(it.points||1),0);
  let html=`<section class="sec${teacherSection(sec)?' teacher':''}"><div class="sec-h"><div><h2>${esc(sec.title)}${sec.sub?`<small>${esc(sec.sub)}</small>`:''}</h2></div><span class="pts">${pts} ${pts>1?'points':'point'}</span></div>${sec.audio?`<div class="secaud"><button type="button" class="play" data-audio="${esc(sec.audio)}" aria-label="Nghe">${PLAY}</button><div><b>${esc(sec.audioLabel||'Listen to the recording')}</b><small>${esc(sec.audioHint||'Nghe 2 lần rồi trả lời.')}</small></div></div>`:''}${sec.note?`<div class="secnote">${esc(sec.note)}</div>`:''}${sec.passage?`<div class="passage">${String(sec.passage).split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`:''}<div class="items">`;
  sec.items.forEach(it=>{ nRef.n++; it._n=nRef.n; html+=`<div class="it" id="it_${esc(it.id)}"><span class="qn">${nRef.n}</span><div class="body">${itemBody(it)}</div></div>`; });
  html+='</div>';
  if(sec.script) html+=`<details class="script" hidden><summary>📜 Script — đọc lại sau khi nghe</summary><div>${sec.script.map(l=>Array.isArray(l)?`<div class="sl"><b>${esc(l[0])}:</b>${esc(l[1])}</div>`:`<div class="sl">${esc(l)}</div>`).join('')}</div></details>`;
  return html+'</section>';
}
function render(){
  const nRef={n:0};
  $('#hw').innerHTML=PARTS.map(p=>`<div class="part" id="part_${p.key}">${p.secs.map(sec=>secHtml(sec,nRef)).join('')}<div class="partbar" id="pb_${p.key}"></div></div>`).join('');
  bind();
  PARTS.forEach(p=>{ if(graded[p.key]) applyMarks(p.key); drawPart(p.key); });
  updateProgress(); showOverall(false);
}
function itemBody(it){
  const v=answers[it.id];

    case 'mcq': case 'listen_mcq':
      return `<div class="prompt">${esc(it.prompt)}</div>${audio}<div class="opts">${it.options.map(o=>`<button type="button" class="opt${String(o).length>4?' long':''}${v===o?' sel':''}" data-q="${esc(it.id)}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>${mark}`;
    case 'listen_type':
      return `<div class="prompt">${esc(it.prompt)}</div><div class="row">${it.audio?`<button type="button" class="play" data-audio="${esc(it.audio)}" aria-label="Nghe">${PLAY}</button>`:''}<input class="txt" data-q="${esc(it.id)}" value="${esc(v||'')}" placeholder="${esc(it.placeholder||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1"></div>${mark}`;
    case 'gap': {
      const parts=String(it.prompt).split(/_{3,}/);
      const inp=`<input${/mail/i.test(it.prompt)?' class="wide"':''} data-q="${esc(it.id)}" value="${esc(v||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Điền từ">`;
      return `<div class="gapline">${parts.length>1?esc(parts[0])+inp+esc(parts.slice(1).join('____')):esc(it.prompt)+' '+inp}</div>${mark}`;
    }
    case 'translate':
      return `<div class="vi">${esc(it.prompt)}</div>${it.hint?`<span class="hint">💡 ${esc(it.hint)}</span>`:''}<textarea class="tr" rows="2" data-q="${esc(it.id)}" placeholder="Viết câu tiếng Anh…" autocomplete="off" autocapitalize="sentences" spellcheck="false">${esc(v||'')}</textarea>${mark}`;
    case 'shadow':
      return shadowBody(it)+mark;
    case 'writing':
      return `<div class="prompt">${esc(it.prompt)}</div><textarea data-q="${esc(it.id)}" placeholder="Viết câu trả lời của bạn ở đây…">${esc(v||'')}</textarea><div class="wc" data-wc="${esc(it.id)}"></div>${mark}`;
    case 'voice':
      return `<div class="prompt">${esc(it.prompt)}</div>
        <div class="rec" data-rec="${esc(it.id)}">
          <div class="rec-row"><button type="button" class="recbtn go" data-act="start"><span class="dot"></span>Bắt đầu ghi âm</button><span class="timer">00:00</span><div class="meter"><i></i></div></div>
          <div class="rec-out"></div>
          <div class="upl">Không ghi âm được trên máy này? <label>tải file ghi âm có sẵn<input type="file" accept="audio/*" hidden></label> (tối đa 15 MB).</div>
        </div>${mark}`;
  }
  return `<div class="prompt">${esc(it.prompt)}</div>`;
}
function bind(){
  const f=$('#hw');
  f.querySelectorAll('.play').forEach(b=>b.onclick=()=>playAudio(b,b.dataset.audio));
  f.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(isLocked(b.dataset.q)) return;
    const q=b.dataset.q; answers[q]=b.dataset.o;
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
    saveDraft(); updateProgress();
  });
  f.querySelectorAll('input[data-q],textarea[data-q]').forEach(el=>el.oninput=()=>{
    if(isLocked(el.dataset.q)) return;
    answers[el.dataset.q]=el.value; saveDraft(); updateProgress();
    if(el.tagName==='TEXTAREA'&&!el.classList.contains('tr')) wc(el.dataset.q);
  });
  ITEMS.filter(it=>it.type==='writing').forEach(it=>wc(it.id));
  f.querySelectorAll('[data-rec]').forEach(setupRecorder);
  f.querySelectorAll('[data-sh]').forEach(setupShadow);
}
function wc(id){
  const it=ITEMS.find(x=>x.id===id), n=words(answers[id]||''), el=document.querySelector(`[data-wc="${CSS.escape(id)}"]`);
  if(!el) return;
  el.textContent=`${n} từ`+(it.minWords?` · tối thiểu ${it.minWords} từ`:'');
  el.classList.toggle('ok',!it.minWords||n>=it.minWords);
}
function isDone(it){
  if(it.type==='voice') return !!voice[it.id];
  if(it.type==='shadow') return !!(answers[it.id]&&answers[it.id].best);
  if(it.type==='writing') return words(answers[it.id]||'')>=Math.max(1,Math.min(it.minWords||1,3));
  return String(answers[it.id]||'').trim()!=='';
}
function updateProgress(){
  const done=ITEMS.filter(isDone).length, ok=PARTS.filter(p=>graded[p.key]&&graded[p.key].pct>=PASS).length;
  $('#progTxt').innerHTML=`${ok} / ${PARTS.length} part đạt · ${done} / ${ITEMS.length} câu đã làm<div class="chips">${PARTS.map(p=>{ const g=graded[p.key]; return `<button type="button" class="chip5 ${g?(g.pct>=PASS?'pass':'fail'):''}" data-go="${p.key}">${partLabel(p)} ${g?(g.pct>=PASS?'✓ ':'✗ ')+g.pct+'%':'…'}</button>`; }).join('')}</div>`;
  $('#progBar').style.width=(ITEMS.length?done/ITEMS.length*100:0)+'%';
  document.querySelectorAll('#progTxt [data-go]').forEach(b=>b.onclick=()=>document.getElementById('part_'+b.dataset.go).scrollIntoView({behavior:'smooth'}));
  const left=PARTS.filter(p=>!graded[p.key]);
  $('#send').textContent=left.length>1?'Chấm các part còn lại':left.length?'Chấm '+partLabel(left[0]):'Xong';
  $('#bar').hidden=!left.length;
  PARTS.forEach(p=>{ if(!graded[p.key]){ const el=document.querySelector(`#pb_${p.key} .pdone`); if(el){ const d=p.items.filter(isDone).length; el.textContent=`${d} / ${p.items.length} câu đã làm`; } } });
}

/* ---------------- recorder */
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']) if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
const extOf=m=>/mp4|m4a|aac/.test(m)?'m4a':/ogg/.test(m)?'ogg':/mpeg|mp3/.test(m)?'mp3':/wav/.test(m)?'wav':'webm';
function setupRecorder(box){
  const id=box.dataset.rec, it=ITEMS.find(x=>x.id===id), maxSec=it.maxSec||180;
  const startBtn=box.querySelector('[data-act]'), timer=box.querySelector('.timer'), meter=box.querySelector('.meter i'), out=box.querySelector('.rec-out');
  let rec=null, stream=null, chunks=[], t0=0, tick=null, ctx=null, an=null, raf=null;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
  function showResult(){
    const v=voice[id];
    out.innerHTML=v?`<audio controls src="${v.url}"></audio><div class="row"><span class="mark right">✓ Đã có bản ghi${v.sec?' · '+fmt(v.sec):''}</span><button type="button" class="recbtn ghost" data-del>🗑 Xoá & ghi lại</button></div>`:'';
    const del=out.querySelector('[data-del]'); if(del) del.onclick=()=>{ if(isLocked(id)) return; URL.revokeObjectURL(v.url); delete voice[id]; showResult(); updateProgress(); };
    startBtn.style.display=v?'none':''; timer.textContent=v&&v.sec?fmt(v.sec):'00:00';
  }
  function cleanup(){ clearInterval(tick); cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); if(ctx) ctx.close().catch(()=>{}); stream=null; ctx=null; meter.style.width='0'; }
  startBtn.onclick=async()=>{
    if(isLocked(id)) return;
    if(rec&&rec.state==='recording'){ rec.stop(); return; }
    const mime=pickMime();
    if(mime===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Trình duyệt này không hỗ trợ ghi âm — hãy dùng nút "tải file ghi âm có sẵn".',5000); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ toast('Chưa được phép dùng micro. Hãy cho phép micro trong trình duyệt rồi thử lại.',5000); return; }
    chunks=[]; rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const type=rec.mimeType||mime||'audio/webm', blob=new Blob(chunks,{type}), sec=(Date.now()-t0)/1000;
      cleanup(); startBtn.className='recbtn go'; startBtn.innerHTML='<span class="dot"></span>Bắt đầu ghi âm';
      if(blob.size<1000){ toast('Bản ghi quá ngắn, hãy thử lại.'); return; }
      voice[id]={blob,type,url:URL.createObjectURL(blob),sec,ext:extOf(type)}; showResult(); updateProgress();
    };
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); an=ctx.createAnalyser(); an.fftSize=512; ctx.createMediaStreamSource(stream).connect(an);
      const buf=new Uint8Array(an.fftSize);
      const draw=()=>{ an.getByteTimeDomainData(buf); let m=0; for(const x of buf) m=Math.max(m,Math.abs(x-128)); meter.style.width=Math.min(100,m/128*180)+'%'; raf=requestAnimationFrame(draw); }; draw();
    }catch(e){}
    rec.start(1000); t0=Date.now();
    startBtn.className='recbtn stop'; startBtn.innerHTML='<span class="dot"></span>Dừng ghi âm';
    tick=setInterval(()=>{ const s=(Date.now()-t0)/1000; timer.textContent=fmt(s); if(s>=maxSec){ rec.stop(); toast('Đã đủ thời lượng tối đa.'); } },250);
  };
  box.querySelector('input[type=file]').onchange=e=>{
    const file=e.target.files[0]; e.target.value=''; if(!file||isLocked(id)) return;
    if(file.size>15*1024*1024){ toast('File quá lớn (tối đa 15 MB).'); return; }
    if(voice[id]) URL.revokeObjectURL(voice[id].url);
    voice[id]={blob:file,type:file.type||'audio/mpeg',url:URL.createObjectURL(file),sec:0,ext:(file.name.split('.').pop()||extOf(file.type)).toLowerCase().slice(0,5)};
    showResult(); updateProgress();
  };
  showResult();
}

/* ---------------- grading (one part at a time) */
function gradeItems(items){
  let score=0,max=0; const details={};
  for(const it of items){
    if(!AUTO.includes(it.type)||(!it.answers&&it.type!=='shadow')) continue;
    const pts=it.points||1; max+=pts;
    if(it.type==='shadow'){ const r=answers[it.id], got=r&&r.best?Math.round(r.best.s*10)/10:0; score+=got; details[it.id]={ok:got>=8,got,pts}; continue; }
    if(it.type==='translate'){ const t=gradeTr(it,answers[it.id]||''); score+=t.got; details[it.id]=t; continue; }
    const v=String(answers[it.id]||''), ok=v.trim()!=='' && it.answers.map(norm).includes(norm(v));
    if(ok) score+=pts; details[it.id]={v,ok,got:ok?pts:0,pts};
  }
  score=Math.round(score*10)/10;
  return {score,max,pct:max?Math.round(score/max*100):0,details};
}
function showMarks(items,details){
  items.forEach(it=>{
    const el=document.getElementById('it_'+it.id); if(!el) return;
    const box=el.querySelector('.markbox'); el.classList.remove('right','wrong','half');
    const d=details[it.id];
    if(d&&it.type==='shadow'){ const c=d.got>=8?'right':d.got>=5?'half':'wrong'; el.classList.add(c); box.innerHTML=`<span class="mark ${c}">🎙 Điểm đọc: ${fmt1(d.got)} / 10</span>`; }
    else if(d&&it.type==='translate'){
      const c=d.got>=d.pts?'right':d.got>0?'half':'wrong'; el.classList.add(c);
      box.innerHTML=`<div class="trfb"><div><span class="mark ${c}">${c==='right'?'✓ Correct':c==='half'?'≈ Gần đúng':'✗ Chưa đúng'} · ${d.got}/${d.pts}</span></div>${d.v.trim()?`<div>Bạn viết: ${d.html}</div>`:''}<div class="key" style="margin:0">Đáp án: <b>${esc(it.show||it.answers[0])}</b></div></div>`;
    }
    else if(d){ const ok=d.ok; el.classList.add(ok?'right':'wrong'); box.innerHTML=`<span class="mark ${ok?'right':'wrong'}">${ok?'✓ Correct':'✗ Wrong'}</span> <span class="key">Answer: <b>${esc(it.show||it.answers[0])}</b></span>`; }
  });
}
function applyMarks(key){
  const box=document.getElementById('part_'+key), g=graded[key], p=PARTS.find(x=>x.key===key);
  showMarks(p.items,g.details);
  box.querySelectorAll('details.script').forEach(d=>d.hidden=false);
  box.querySelectorAll('input,textarea,.opt,.recbtn,.shrec').forEach(el=>{ el.disabled=true; });
  box.querySelectorAll('.shtext').forEach(t=>t.classList.remove('self'));
}
function drawPart(key){
  const p=PARTS.find(x=>x.key===key), g=graded[key], el=document.getElementById('pb_'+key);
  if(!g){
    el.className='partbar';
    el.innerHTML=`<div class="ptxt">${esc(p.name)}<small class="pdone"></small></div><button type="button" class="btn blue" data-grade="${key}">✓ Chấm ${partLabel(p)}</button>`;
  }else{
    const pass=g.pct>=PASS;
    el.className='partbar '+(pass?'pass':'fail');
    el.innerHTML=`<div class="pbig">${g.pct}%</div><div class="ptxt">${pass?'✅ Đạt':'❌ Chưa đạt — cần 80%'} · ${esc(p.name)}<small>${fmt1(g.score)} / ${g.max} điểm · xem đáp án ở từng câu phía trên</small></div>${pass?'':`<button type="button" class="btn blue" data-redo="${key}">↻ Làm lại ${partLabel(p)}</button>`}`;
  }
  const gb=el.querySelector('[data-grade]'); if(gb) gb.onclick=()=>gradeParts([key]);
  const rb=el.querySelector('[data-redo]'); if(rb) rb.onclick=()=>redoPart(key);
}
async function gradeParts(keys,silent){
  keys=keys.filter(k=>!graded[k]); if(!keys.length) return;
  if(!silent){
    if(!GT.get()){ const st=await GT.requireName(); if(!st) return; }
    const missing=PARTS.filter(p=>keys.includes(p.key)).flatMap(p=>p.items).filter(it=>!isDone(it));
    if(missing.length){
      const go=await modal('Còn câu chưa làm',`<p>Bạn còn <b>${missing.length}</b> câu chưa làm${keys.length===1?' trong part này':''}. Vẫn chấm?</p>`,[{label:'Làm tiếp',value:false},{label:'Vẫn chấm',value:true,cls:'blue'}]);
      if(!go){ const first=document.getElementById('it_'+missing[0].id); first&&first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    }
    stopAudio(); if(window.__shStop) window.__shStop();
  }
  keys.forEach(k=>{
    const p=PARTS.find(x=>x.key===k); graded[k]=gradeItems(p.items); applyMarks(k); drawPart(k);
    if(!silent) GT.log({kind:'homework_part',sid:SESSION,part:partLabel(p),pct:graded[k].pct,passed:graded[k].pct>=PASS});
  });
  saveState(); saveDraft(); updateProgress(); recordBest(!silent);
  if(!silent){
    if(PARTS.every(p=>graded[p.key])) showOverall(true);
    else document.getElementById('pb_'+keys[keys.length-1]).scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function totals(){
  let score=0,max=0; PARTS.forEach(p=>{ const g=graded[p.key]; max+=g?g.max:gradeItems(p.items).max; if(g) score+=g.score; });
  const passed=PARTS.filter(p=>graded[p.key]&&graded[p.key].pct>=PASS).length;
  return {score:Math.round(score*10)/10,max,pct:max?Math.round(score/max*100):0,passed,all:passed===PARTS.length,complete:PARTS.every(p=>graded[p.key])};
}
function recordBest(live){
  const t=totals();
  try{ localStorage.setItem('gt_hw5_best_'+SESSION,JSON.stringify({pct:t.pct,passed:t.all,done:t.passed,total:PARTS.length,parts:Object.fromEntries(PARTS.map(p=>[p.key,graded[p.key]?graded[p.key].pct:null])),at:Date.now()})); }catch(e){}
  if(live&&t.complete) GT.log({kind:'homework',sid:SESSION,pct:t.pct,passed:t.all});
}
function redoPart(key){
  const p=PARTS.find(x=>x.key===key);
  delete graded[key]; p.items.forEach(it=>{ delete answers[it.id]; if(voice[it.id]){ URL.revokeObjectURL(voice[it.id].url); delete voice[it.id]; } });
  saveDraft(); saveState(); recordBest(false); render();
  document.getElementById('part_'+key).scrollIntoView({behavior:'smooth'});
}
function showOverall(scroll){
  const r=$('#result'), t=totals();
  if(!t.complete){ r.style.display='none'; return; }
  const rows=PARTS.map(p=>{ const g=graded[p.key], ok=g.pct>=PASS; return `<div class="${ok?'pass':'fail'}"><span>${esc(p.name)}</span><b>${ok?'✓':'✗'} ${g.pct}%${ok?'':`<button type="button" data-redo2="${p.key}">↻ Làm lại</button>`}</b></div>`; }).join('');
  const left=PARTS.filter(p=>graded[p.key].pct<PASS);
  r.innerHTML=`<div class="res ${t.all?'pass':'fail'}"><div class="score">${t.passed}<small> / ${PARTS.length} part đạt</small></div><div class="sub2">Tổng: ${fmt1(t.score)} / ${t.max} điểm (${t.pct}%)</div><div class="secbreak">${rows}</div>
    <h2>${t.all?'✅ Hoàn thành homework':'❌ Còn '+left.length+' part cần làm lại'}</h2>
    <p>${t.all?'Tất cả các part đều đạt từ 80% trở lên. Great job!':'Mỗi part cần đạt <b>80%</b>. Chỉ làm lại part chưa đạt — các part đã đạt được giữ nguyên.'}</p>
    <div class="acts">${t.all?`<a class="btn blue" href="../">← All lessons</a><button class="btn light" type="button" id="againAll">↻ Làm lại toàn bộ</button>`:`<button class="btn blue" type="button" data-redo2="${left[0].key}">↻ Làm lại ${partLabel(left[0])}</button>`}</div></div>`;
  r.style.display='block'; if(scroll) r.scrollIntoView({behavior:'smooth'});
  r.querySelectorAll('[data-redo2]').forEach(b=>b.onclick=()=>redoPart(b.dataset.redo2));

}
function submit(){ gradeParts(PARTS.filter(p=>!graded[p.key]).map(p=>p.key)); }

/* ---------------- 5-part homework helpers: translate + shadow */
const fmt1=x=>{ const r=Math.round(x*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); };
/* ---- word normalisation shared by translate + shadow */
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","there's":"there is","that's":"that is","what's":"what is","where's":"where is","who's":"who is","how's":"how is","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","couldn't":"could not","haven't":"have not","hasn't":"has not","i've":"i have","you've":"you have","we've":"we have","i'll":"i will","you'll":"you will","we'll":"we will","i'd":"i would","let's":"let us","name's":"name is"};
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const ORD={one:'first',two:'second',three:'third',five:'fifth',eight:'eighth',nine:'ninth',twelve:'twelfth',twenty:'twentieth',thirty:'thirtieth',forty:'fortieth',fifty:'fiftieth',sixty:'sixtieth',seventy:'seventieth',eighty:'eightieth',ninety:'ninetieth'};
function numW(n){ n=+n; if(n<20) return [ONES[n]]; if(n<100) return n%10?[TENS[Math.floor(n/10)],ONES[n%10]]:[TENS[n/10]]; if(n<1000) return [ONES[Math.floor(n/100)],'hundred'].concat(n%100?numW(n%100):[]); return String(n).split('').map(d=>ONES[+d]); }
function ordW(n){ const w=numW(n); const l=w[w.length-1]; w[w.length-1]=ORD[l]||(l+'th'); return w; }
const SPELL={neighbour:'neighbor',neighbours:'neighbors',neighbourhood:'neighborhood',neighbourhoods:'neighborhoods',centre:'center',centrally:'centrally',favourite:'favorite',colour:'color',mum:'mom',okay:'ok',email:'email','e-mail':'email',cafe:'cafe'};
/* returns [{raw, toks:[...]}] for each written word */
function wordsOf(text){
  let t=String(text||'').replace(/[’‘]/g,"'").replace(/é/g,'e').replace(/\b([ap])\.\s?m\b\.?/gi,'$1m').replace(/\bo'clock\b/gi,'')
    .replace(/[\w.\-]+@[\w\-]+(\.[\w\-]+)+/g,m=>m.replace(/@/g,' at ').replace(/\./g,' dot ').replace(/_/g,' underscore ').replace(/-/g,' hyphen '))
    .replace(/([A-Za-z0-9])\.(com|net|org|vn|edu)\b/gi,'$1 dot $2');
  const raw=t.match(/[A-Za-z0-9][A-Za-z0-9'@.:\-]*/g)||[];
  return raw.map(r=>({raw:r,toks:normTok(r)}));
}
function normTok(r){
  let w=r.toLowerCase().replace(/[’‘]/g,"'").replace(/[éè]/g,'e').replace(/[.,!?;"]+$/,'').replace(/^[.,'"]+|'+$/g,'');
  if(!w) return [];
  if(/^[a-z](-[a-z])+$/.test(w)) return [w.replace(/-/g,'')];          // spelled letters L-I-N-H → linh
  let m=w.match(/^(\d{1,2})[:.](\d{2})$/); if(m) return numW(m[1]).concat(+m[2]?(+m[2]<10?['oh'].concat(numW(m[2])):numW(m[2])):[]);
  m=w.match(/^(\d{1,2})(?:[:.](\d{2}))?(am|pm)$/); if(m) return normTok(m[1]+(m[2]?':'+m[2]:'')).concat([m[3]]);
  m=w.match(/^(\d+)(st|nd|rd|th)$/); if(m) return ordW(m[1]);
  if(/^\d+$/.test(w)) return numW(w);
  if(CONTR[w]) return CONTR[w].split(' ');
  if(/-/.test(w)) return w.split('-').filter(Boolean).flatMap(x=>normTok(x));
  w=w.replace(/'s$/,'s').replace(/'/g,'').replace(/[^a-z0-9]/g,'');
  if(SPELL[w]) w=SPELL[w];
  if(w==='oclock') return [];
  if(w==='lowercase') return ['lower','case'];
  return w?[w]:[];
}
function joinLetters(toks){ // heard "l i n h" → "linh"
  const out=[]; let run=[];
  const flush=()=>{ if(run.length>=3) out.push(run.join('')); else out.push(...run); run=[]; };
  toks.forEach(t=>{ if(t.length===1&&/[a-z]/.test(t)) run.push(t); else { flush(); out.push(t); } }); flush(); return out;
}
function lcsMatch(a,b){ // returns boolean array for a: token matched in order
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const ok=new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ ok[i]=true; i++; j++; } else if(D[i+1][j]>=D[i][j+1]) i++; else j++; }
  return ok;
}
function editDist(a,b){ const D=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) D[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return D[a.length][b.length]; }
/* ---- translate grading: exact (after normalising) = full points, one word off = half */
function gradeTr(it,v){
  const pts=it.points||2, W=wordsOf(v), mine=W.flatMap(w=>w.toks);
  let best=null;
  it.answers.forEach(a=>{ const t=wordsOf(a).flatMap(w=>w.toks), d=editDist(mine,t); if(!best||d<best.d) best={d,t}; });
  let got=0; if(mine.length&&best){ if(best.d===0) got=pts; else if(best.d===1&&best.t.length>=5) got=Math.round(pts/2*10)/10; }
  // colour the learner's words against the closest model answer
  const okTok=best?lcsMatch(mine,best.t):[]; let k=0;
  const html=W.map(w=>{ let good=w.toks.length>0; w.toks.forEach(()=>{ if(!okTok[k]) good=false; k++; }); return `<span class="w ${good?'ok':'bad'}">${esc(w.raw)}</span>`; }).join(' ');
  return {v,got,pts,ok:got>=pts,html};
}
/* ---- shadowing: listen, record, speech-recognition scoring /10 */
let audRate=1;
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function shadowBody(it){
  const sents=it.sentences.map((s,i)=>`<span class="shs"><button type="button" class="sp" data-audio="${esc(s.audio)}" aria-label="Nghe câu ${i+1}">${PLAY}</button>${wordsOf(s.text).length?spanWords(s.text,i):''}</span>`).join(' ');
  return `<div class="prompt">${esc(it.prompt||'Nghe mẫu, sau đó ghi âm giọng đọc của bạn.')}</div>
  <div class="shbox" data-sh="${esc(it.id)}">
    <div class="shtools"><button type="button" class="play" data-audio="${esc(it.audio)}" aria-label="Nghe cả đoạn">${PLAY}</button><span class="lbl">Nghe cả đoạn</span>
      <span style="flex:1"></span><button type="button" class="pill" data-rate="0.8">🐢 Chậm</button><button type="button" class="pill on" data-rate="1">Bình thường</button></div>
    <div class="shtext">${sents}</div>
    <div class="legend">Bấm ▶ trước mỗi câu để nghe riêng câu đó. Sau khi chấm: <span class="sw ok">đọc đúng</span> · <span class="sw bad">đọc sai / thiếu</span> — luyện lại những từ màu đỏ rồi ghi âm lần nữa.</div>
    <div class="rec-row"><button type="button" class="recbtn go shrec"><span class="dot"></span>Ghi âm & chấm điểm</button><span class="timer">00:00</span><div class="meter"><i></i></div></div>
    <div class="heard" hidden></div>
    <div class="shout"></div>
  </div>`;
}
function spanWords(text,si){ return String(text).split(/(\s+)/).map(p=>/^\s+$/.test(p)||!p?p:`<span class="sw" data-s="${si}">${esc(p)}</span>`).join(''); }
function setupShadow(box){
  const id=box.dataset.sh, it=ITEMS.find(x=>x.id===id);
  const btn=box.querySelector('.shrec'), timer=box.querySelector('.timer'), meter=box.querySelector('.meter i'), heardEl=box.querySelector('.heard'), out=box.querySelector('.shout'), txt=box.querySelector('.shtext');
  const spans=[...txt.querySelectorAll('.sw')];
  const wtoks=spans.map(sp=>normTok(sp.textContent.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9.]+$/g,'')));
  const FREE=new Set((it.free||[]).flatMap(w=>normTok(w)));
  const total=wtoks.reduce((a,t)=>a+t.length,0);
  box.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{ audRate=+p.dataset.rate; box.querySelectorAll('.pill').forEach(x=>x.classList.toggle('on',x===p)); if(player) player.playbackRate=audRate; });
  box.querySelectorAll('.sp').forEach(b=>b.onclick=()=>playAudio(b,b.dataset.audio));
  let rec=null,stream=null,chunks=[],sr=null,finals=[],interim='',recording=false,t0=0,tick=null,ctx=null,raf=null,lastUrl=null,srErr='';
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
  function paint(res){
    spans.forEach((sp,i)=>{ sp.classList.remove('ok','bad'); if(res&&res.m) sp.classList.add(res.m[i]?'ok':'bad'); });
    txt.classList.toggle('self',!!(res&&res.self&&!isLocked(id)));
  }
  function show(){
    const r=answers[id];
    paint(r&&r.last);
    if(!r||!r.last){ out.innerHTML=''; return; }
    const s=r.last.s, cls=s>=8?'hi':s>=5?'mid':'lo';
    out.innerHTML=`<div class="shres"><div class="sc10 ${cls}">${fmt1(s)}<small> / 10</small></div><div class="shmeta">${r.last.self?'Tự chấm: bấm vào từ bạn đọc sai để chuyển sang màu đỏ.<br>':''}Đúng ${r.last.ok}/${r.last.tot} từ · Điểm cao nhất: <b>${fmt1(r.best.s)}/10</b> · ${r.tries||1} lần ghi âm</div>${lastUrl?`<audio controls src="${lastUrl}" style="max-width:260px"></audio>`:''}</div>`;
  }
  function score(alts){
    // alts: array of transcripts (best first). Align best transcript in order, then accept words found in other alternatives.
    const heard=joinLetters(alts[0]?wordsOf(alts[0]).flatMap(w=>w.toks):[]);
    const flat=[], owner=[]; wtoks.forEach((t,i)=>t.forEach(x=>{ flat.push(x); owner.push(i); }));
    const ok=lcsMatch(flat,heard);
    const pool={}; alts.slice(1).forEach(a=>joinLetters(wordsOf(a).flatMap(w=>w.toks)).forEach(x=>pool[x]=(pool[x]||0)+1));
    flat.forEach((x,k)=>{ if(!ok[k]&&FREE.has(x)) ok[k]=true; else if(!ok[k]&&pool[x]>0){ pool[x]--; ok[k]=true; } });
    const m=wtoks.map(()=>true); flat.forEach((x,k)=>{ if(!ok[k]) m[owner[k]]=false; });
    const good=ok.filter(Boolean).length;
    return {s:total?Math.round(good/total*100)/10:0,m,ok:good,tot:total};
  }
  function commit(res){
    const r=answers[id]||{tries:0}; r.tries=(r.tries||0)+1; r.last=res; if(!r.best||res.s>=r.best.s) r.best=res;
    answers[id]=r; saveDraft(); show(); updateProgress();
  }
  txt.addEventListener('click',e=>{
    const sp=e.target.closest('.sw'), r=answers[id]; if(!sp||isLocked(id)||!r||!r.last||!r.last.self) return;
    const i=spans.indexOf(sp); r.last.m[i]=!r.last.m[i];
    let good=0; wtoks.forEach((t,k)=>{ if(r.last.m[k]) good+=t.length; });
    r.last.ok=good; r.last.s=total?Math.round(good/total*100)/10:0; r.best=r.last; saveDraft(); show();
  });
  function cleanup(){ clearInterval(tick); cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); if(ctx) ctx.close().catch(()=>{}); stream=null; ctx=null; meter.style.width='0'; }
  async function start(){
    if(isLocked(id)) return;
    stopAudio();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast('Trình duyệt này không ghi âm được. Hãy dùng Chrome hoặc Edge.',5000); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ toast('Chưa được phép dùng micro. Hãy cho phép micro rồi thử lại.',5000); return; }
    finals=[]; interim=''; srErr=''; chunks=[]; recording=true;
    const mime=pickMime();
    try{ rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.start(500); }catch(e){ rec=null; }
    if(SRC){
      sr=new SRC(); sr.lang='en-GB'; sr.continuous=true; sr.interimResults=true; sr.maxAlternatives=3;
      sr.onresult=e=>{ interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finals.push([...r].map(a=>a.transcript)); else interim+=r[0].transcript; }
        heardEl.hidden=false; heardEl.textContent='🎧 '+(finals.map(f=>f[0]).join(' ')+' '+interim).trim(); };
      sr.onerror=e=>{ srErr=e.error||'error'; };
      sr.onend=()=>{ if(recording&&!/not-allowed|service-not-allowed|language/.test(srErr)) try{ sr.start(); }catch(e){} };
      try{ sr.start(); }catch(e){ srErr='start'; }
    }
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); const an=ctx.createAnalyser(); an.fftSize=512; ctx.createMediaStreamSource(stream).connect(an);
      const buf=new Uint8Array(an.fftSize); const draw=()=>{ an.getByteTimeDomainData(buf); let m=0; for(const x of buf) m=Math.max(m,Math.abs(x-128)); meter.style.width=Math.min(100,m/128*180)+'%'; raf=requestAnimationFrame(draw); }; draw(); }catch(e){}
    t0=Date.now(); const maxS=Math.max(30,(it.dur||30)*2.5);
    btn.className='recbtn stop shrec'; btn.innerHTML='<span class="dot"></span>Dừng & chấm điểm';
    heardEl.hidden=!SRC; heardEl.textContent='🎧 Đang nghe… hãy đọc to, rõ ràng.';
    tick=setInterval(()=>{ const s=(Date.now()-t0)/1000; timer.textContent=fmt(s); if(s>=maxS) stop(); },250);
    window.__shStop=()=>{ if(recording) stop(true); };
  }
  function stop(silent){
    if(!recording) return; recording=false; window.__shStop=null;
    btn.className='recbtn go shrec'; btn.innerHTML='<span class="dot"></span>Đang chấm…'; btn.disabled=true;
    const sec=(Date.now()-t0)/1000;
    if(rec&&rec.state!=='inactive'){ rec.onstop=()=>{ if(chunks.length){ if(lastUrl) URL.revokeObjectURL(lastUrl); lastUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); } show(); }; rec.stop(); }
    if(sr) try{ sr.stop(); }catch(e){}
    cleanup();
    setTimeout(()=>{
      if(sr){ sr.onend=null; sr.onresult=null; }
      btn.disabled=isLocked(id); btn.innerHTML='<span class="dot"></span>Ghi âm lại & chấm điểm';
      if(silent) return;
      if(sec<2){ toast('Bản ghi quá ngắn, hãy thử lại.'); return; }
      const alts=[finals.map(f=>f[0]).join(' ')+' '+interim, finals.map(f=>f[1]||'').join(' '), finals.map(f=>f[2]||'').join(' ')];
      if(SRC&&!/not-allowed|service-not-allowed|network|start|language/.test(srErr)){
        if(!alts[0].trim()){ toast('Chưa nghe được giọng đọc. Kiểm tra micro và đọc to hơn nhé.',5000); }
        commit(score(alts));
      }else{
        // no speech recognition on this browser → self-check
        toast('Trình duyệt này không tự chấm được. Hãy nghe lại bản ghi và bấm vào từ bạn đọc sai.',6500);
        const m=wtoks.map(()=>true); commit({s:10,m,ok:total,tot:total,self:true});
      }
    },SRC?900:50);
  }
  btn.onclick=()=>{ if(recording) stop(); else start(); };
  if(!SRC) box.querySelector('.legend').insertAdjacentHTML('beforeend','<br>⚠ Trình duyệt này chưa hỗ trợ chấm tự động — hãy dùng <b>Google Chrome</b> hoặc <b>Microsoft Edge</b> để được chấm điểm.');
  show();
}

/* ---------------- boot */
async function boot(){
  $('#send').onclick=submit;
  let data;
  GT.renderMe(); if(GT.guard(SESSION,'../')) return;
  try{ const r=await fetch('data/'+SESSION+'.json',{cache:'no-cache'}); if(!r.ok) throw 0; data=await r.json(); }
  catch(e){ $('#hw').innerHTML=`<div class="loading">Chưa có homework cho buổi ${esc(SESSION)}. <a href="../">Về trang chủ</a></div>`; return; }
  HW=data;
  document.title=`Homework ${SESSION} · ${HW.title}`;
  $('#kick').textContent='Homework · '+SESSION; $('#title').innerHTML=`${esc(HW.title)} — <em>${esc(HW.kind||'Homework')} homework</em>`; $('#intro').textContent=HW.kind==='5-part'?'5 part: Từ vựng · Đọc · Nghe · Shadowing (máy chấm /10) · Dịch Việt → Anh. Mỗi part chấm riêng và cần đạt 80% — part nào dưới 80% thì chỉ làm lại part đó.':'';
  ITEMS=HW.sections.flatMap(s=>s.items); buildParts();
  loadDraft(); render();
  const done=loadState().filter(k=>PARTS.some(p=>p.key===k)); if(done.length) gradeParts(done,true);
}
boot();
})();
